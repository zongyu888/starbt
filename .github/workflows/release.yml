name: 发布新版本

# 推送 v* 标签（或手动触发）时：编译 amd64 + arm64 → 打包 → 计算 sha256 →
# 自动创建 GitHub Release 并上传。安装脚本从 Release 下载这些文件。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 编译并发布
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: 校验标签与 VERSION 一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          [ "refs/tags/$v" = "$GITHUB_REF" ] || { echo "标签 $GITHUB_REF 与 VERSION($v) 不一致"; exit 1; }
      - name: 编译 amd64 / arm64 并打包
        run: |
          mkdir -p out
          for arch in amd64 arm64; do
            mkdir -p "pkg/$arch"
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "pkg/$arch/sbt" ./cmd/sbt
            tar -czf "out/sbt_linux_$arch.tar.gz" -C "pkg/$arch" sbt
            ( cd out && sha256sum "sbt_linux_$arch.tar.gz" > "sbt_linux_$arch.tar.gz.sha256" )
          done
          ls -l out
      - name: 创建 GitHub Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          name: StarBT ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            out/*.tar.gz
            out/*.sha256
